<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vova40 — Добавить товар</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #f5f5f5; color: #333; }
        .header { background: white; padding: 16px 20px; display: flex; align-items: center; gap: 16px;
                  border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
        .header a { text-decoration: none; font-size: 22px; color: #333; }
        .header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .header h1 .logo { display: inline-flex; align-items: center; justify-content: center;
                           background: linear-gradient(135deg, #4A90D9, #357ABD);
                           color: white; border-radius: 10px; padding: 2px 8px;
                           font-size: 14px; font-weight: 800; letter-spacing: 1px; }
        .content { max-width: 500px; margin: 0 auto; padding: 16px; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        select, input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 10px 14px;
                font-size: 16px; border: 2px solid #ddd; border-radius: 10px; outline: none; background: white; }
        select:focus, input:focus { border-color: #4A90D9; }
        .photo-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-top: 8px;
                         display: none; }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: none; border-radius: 10px;
                 background: #4A90D9; color: white; cursor: pointer; margin-top: 8px; }
        button:hover { background: #357ABD; }
        .hint { font-size: 12px; color: #aaa; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('index') }}">←</a>
        <h1><span class="logo">40</span> Vova40</h1>
        <span style="font-size:14px;color:#888;">Новый товар</span>
    </div>
    <div class="content">
        <div class="card">
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Категория</label>
                    <select name="category" required>
                        {% for c in categories %}
                            <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Бренд</label>
                    <input type="text" name="brand" placeholder="Zara, Nike, H&M...">
                    <div class="hint">Можно пропустить</div>
                </div>
                <div class="form-group">
                    <label>Размер</label>
                    <input type="text" name="size" placeholder="M, 42, L...">
                    <div class="hint">Можно пропустить</div>
                </div>
                <div class="form-group">
                    <label>Состояние</label>
                    <select name="condition">
                        {% for c in conditions %}
                            <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Цена закупки (₽)</label>
                    <input type="number" name="purchase_price" step="1" min="0" placeholder="500">
                </div>
                <div class="form-group">
                    <label>Цена продажи (₽)</label>
                    <input type="number" name="sale_price" step="1" min="0" placeholder="1500" required>
                </div>
                <div class="form-group">
                    <label>Фото</label>
                    <input type="file" name="photo" accept="image/*" id="photoInput">
                    <img id="preview" class="photo-preview">
                    <div class="hint">Необязательно</div>
                </div>
                <button type="submit">💾 Сохранить товар</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('photoInput').onchange = function(e) {
            const img = document.getElementById('preview');
            if (e.target.files && e.target.files[0]) {
                img.src = URL.createObjectURL(e.target.files[0]);
                img.style.display = 'block';
            }
        };
    </script>
</body>
</html>
